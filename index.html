<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>लॉगिन | YudhhAbhyas Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Global Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <p id="loaderText" style="color: var(--primary); font-family: 'Outfit', sans-serif; letter-spacing: 1.5px;">
            प्रमाणित किया जा रहा है...</p>
    </div>

    <div class="auth-container">
        <!-- Login Card -->
        <div class="card auth-card fade-in" id="loginWrapper">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="color: var(--primary); font-size: 2.2rem; margin-bottom: 0.5rem;">YudhhAbhyas</h1>
                <p style="color: var(--text-dim); font-size: 0.9rem;">छात्र पोर्टल में आपका स्वागत है</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label>छात्र आईडी (Student ID)</label>
                    <input type="text" id="studentId" placeholder="उदा: CGPSC123" required autocomplete="username">
                </div>
                <div class="input-group" style="position: relative;">
                    <label>पासवर्ड</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"
                        style="padding-right: 40px;">
                    <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('password', this)"
                        style="position: absolute; right: 15px; top: 38px; color: var(--text-dim); cursor: pointer;"></i>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> लॉगिन करें
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; color: var(--text-dim); font-size: 0.85rem;">
                नया खाता? <a href="#" onclick="toggleAuth()"
                    style="color: var(--primary); text-decoration: none; font-weight: 600;">नामांकन करें</a>
            </div>

            <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); text-align: center;">
                <button onclick="testConnection()" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.4rem;">
                    <i class="fas fa-plug"></i> कनेक्शन चेक करें
                </button>
                <p id="apiStatusDisplay" style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--text-dim);"></p>
            </div>
        </div>

        <!-- Signup Card -->
        <div class="card auth-card fade-in" id="signupWrapper" style="display: none;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="color: var(--primary); font-size: 2.2rem; margin-bottom: 0.5rem;">नया नामांकन</h1>
                <p style="color: var(--text-dim); font-size: 0.9rem;">अपना योद्धा प्रोफाइल बनाएं</p>
            </div>

            <form id="signupForm">
                <div class="input-group">
                    <label>पूरा नाम</label>
                    <input type="text" id="newName" placeholder="आपका नाम" required>
                </div>
                <div class="input-group">
                    <label>नया छात्र आईडी (Student ID)</label>
                    <input type="text" id="newId" placeholder="उदा: YOURNAME123" required>
                </div>
                <div class="input-group" style="position: relative;">
                    <label>पासवर्ड सेट करें</label>
                    <input type="password" id="newPassword" placeholder="••••••••" required
                        style="padding-right: 40px;">
                    <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('newPassword', this)"
                        style="position: absolute; right: 15px; top: 38px; color: var(--text-dim); cursor: pointer;"></i>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> प्रोफाइल बनाएं
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; color: var(--text-dim); font-size: 0.85rem;">
                पहले से खाता है? <a href="#" onclick="toggleAuth()"
                    style="color: var(--primary); text-decoration: none; font-weight: 600;">लॉगिन करें</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function toggleAuth() {
            const login = document.getElementById('loginWrapper');
            const signup = document.getElementById('signupWrapper');
            if (login.style.display === 'none') {
                login.style.display = 'block';
                signup.style.display = 'none';
            } else {
                login.style.display = 'none';
                signup.style.display = 'block';
            }
        }
        function togglePasswordVisibility(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconElement.classList.remove('fa-eye');
                iconElement.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                iconElement.classList.remove('fa-eye-slash');
                iconElement.classList.add('fa-eye');
            }
        }
        async function testConnection() {
            const statusDisp = document.getElementById('apiStatusDisplay');
            statusDisp.textContent = "कनेक्शन चेक किया जा रहा है...";
            statusDisp.style.color = "var(--text-dim)";

            try {
                const res = await fetch(`${API_URL}?action=test`);
                const data = await res.json();
                if (data.success) {
                    statusDisp.textContent = "✅ सर्वर तैयार है! " + data.message;
                    statusDisp.style.color = "var(--success)";
                } else {
                    statusDisp.textContent = "❌ सर्वर त्रुटि: " + data.message;
                    statusDisp.style.color = "var(--accent)";
                }
            } catch (err) {
                statusDisp.textContent = "❌ कनेक्शन फेल! URL गलत है या सर्वर बंद है।";
                statusDisp.style.color = "var(--accent)";
            }
        }
    </script>
</body>

</html>
