<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | YudhhAbhyas Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- Desktop Navbar -->
    <nav class="navbar">
        <h1 class="brand" style="color: var(--primary);">YudhhAbhyas</h1>
        <div class="nav-links">
            <button id="logoutBtn" class="btn btn-outline" style="font-size: 0.9rem; padding: 0.5rem 1rem;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
        <!-- Mobile Logout Icon -->
        <button class="logout-btn btn btn-outline mobile-only"
            style="padding: 0.5rem; border: none; font-size: 1.2rem; display: block;">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </nav>

    <main class="main-content">
        <div class="fade-in" style="margin-bottom: 2rem;">
            <h2 id="userNameDisplay" style="font-size: 1.8rem;">आपका स्वागत है</h2>
            <p style="color: var(--text-dim);">आपकी CGPSC तैयारी की प्रगति</p>
        </div>

        <!-- Progress Overview Chart -->
        <div class="card chart-card fade-in"
            style="margin-bottom: 2rem; display: flex; flex-direction: column; align-items: center;">
            <h3 style="margin-bottom: 1.5rem; font-size: 1.1rem; color: var(--primary);">तैयारी का स्तर (Chart)</h3>
            <div style="width: 100%; max-width: 400px; height: 350px;">
                <canvas id="statsChart"></canvas>
            </div>
            <div style="text-align: center; margin-top: 1rem; width: 100%;">
                <span id="overallProgressText" style="font-weight: 600; font-size: 1.2rem; color: var(--primary);">0%
                    एकीकृत प्रगति</span>
                <div class="progress-container" style="margin-top: 0.5rem;">
                    <div class="progress-bar" id="overallProgressBar"></div>
                </div>
            </div>
        </div>

        <!-- Papers Grid -->
        <div class="grid-container fade-in" id="syllabusContainer">
            <!-- Paper cards injected here -->
        </div>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">
            <i class="fas fa-th-large"></i>
            <span>डैशबोर्ड</span>
        </a>
        <a href="leaderboard.html" class="nav-item">
            <i class="fas fa-trophy"></i>
            <span>रणभूमि</span>
        </a>
    </nav>

    <script src="syllabus.js"></script>
    <script src="script.js"></script>
    <script>
        let statsChart;

        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('userNameDisplay').textContent = `Welcome, ${user.name}`;

            renderSyllabus();
            initChart();
        });

        function initChart() {
            const ctx = document.getElementById('statsChart').getContext('2d');
            const data = {
                labels: syllabus.map(p => p.name.split(':')[0]), // "प्रश्न-पत्र 01" format
                datasets: [{
                    label: 'पूर्णता %',
                    data: syllabus.map(() => 0),
                    fill: true,
                    backgroundColor: 'rgba(251, 191, 36, 0.15)',
                    borderColor: '#fbbf24',
                    borderWidth: 2,
                    pointBackgroundColor: '#fbbf24',
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: '#fbbf24'
                }]
            };

            statsChart = new Chart(ctx, {
                type: 'radar',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            pointLabels: { color: '#94a3b8', font: { size: 10 } },
                            ticks: { display: false },
                            suggestedMin: 0,
                            suggestedMax: 100
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
            updateOverallProgress();
        }

        function renderSyllabus() {
            const container = document.getElementById('syllabusContainer');
            container.innerHTML = '';

            syllabus.forEach(paper => {
                const card = document.createElement('div');
                card.className = 'card fade-in';

                const userProgress = JSON.parse(localStorage.getItem(`progress_${paper.id}`)) || {};

                let totalTopics = 0;
                let completedTopics = 0;
                paper.parts.forEach(part => {
                    totalTopics += part.topics.length;
                    part.topics.forEach(topic => {
                        if (userProgress[topic]) completedTopics++;
                    });
                });
                const progressPct = totalTopics > 0 ? (completedTopics / totalTopics) * 100 : 0;

                card.innerHTML = `
                    <div class="subject-header" onclick="toggleTopicList('${paper.id}')">
                        <div>
                            <h3 style="font-size: 1.1rem; margin-bottom: 0.2rem;">${paper.name}</h3>
                            <p style="color: var(--text-dim); font-size: 0.8rem;">कुल ${totalTopics} टॉपिक्स</p>
                        </div>
                        <span id="pct_${paper.id}" style="color: var(--primary); font-weight: 700;">${Math.round(progressPct)}%</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${progressPct}%" id="bar_${paper.id}"></div>
                    </div>
                    <div class="topic-list" id="list_${paper.id}">
                        ${paper.parts.map(part => `
                            <div class="syllabus-part">
                                <h4 class="part-title">${part.name}</h4>
                                <div class="topic-items">
                                    ${part.topics.map(topic => `
                                        <div class="topic-item">
                                            <input type="checkbox" 
                                                ${userProgress[topic] ? 'checked' : ''} 
                                                onchange="updateProgress('${paper.id}', '${topic}', this.checked)">
                                            <span>${topic}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleTopicList(id) {
            const list = document.getElementById(`list_${id}`);
            const isVisible = list.style.display === 'block';
            list.style.display = isVisible ? 'none' : 'block';
        }

        function updateOverallProgress() {
            let totalTopics = 0;
            let totalCompleted = 0;
            const paperProgressData = [];

            syllabus.forEach(paper => {
                const userProgress = JSON.parse(localStorage.getItem(`progress_${paper.id}`)) || {};
                let pTotal = 0;
                let pDone = 0;

                paper.parts.forEach(part => {
                    pTotal += part.topics.length;
                    part.topics.forEach(topic => {
                        if (userProgress[topic]) pDone++;
                    });
                });

                const pPct = pTotal > 0 ? (pDone / pTotal) * 100 : 0;
                paperProgressData.push(Math.round(pPct));
                totalTopics += pTotal;
                totalCompleted += pDone;
            });

            const overallPct = totalTopics > 0 ? Math.round((totalCompleted / totalTopics) * 100) : 0;
            document.getElementById('overallProgressText').textContent = `${overallPct}% एकीकृत प्रगति`;
            document.getElementById('overallProgressBar').style.width = `${overallPct}%`;

            if (statsChart) {
                statsChart.data.datasets[0].data = paperProgressData;
                statsChart.update();
            }
        }
    </script>
</body>

</html>
